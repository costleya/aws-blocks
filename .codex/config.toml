[agents]
max_concurrent_threads_per_session = 100
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[mcp_servers.serena]
command = "serena-shared"
startup_timeout_sec = 60
required = true
args = [
  "proxy",
  "--",
  "--context",
  ".codex/serena/contexts/codex.yml",
  "--mode",
  "one-shot",
  "--mode",
  "no-memories"
]
default_tools_approval_mode = "approve"

[mcp_servers.grepai]
command = "grepai"
args = ["mcp-serve"]
default_tools_approval_mode = "approve"
